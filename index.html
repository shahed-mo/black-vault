<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400&amp;family=Geist:wght@400&amp;display=swap" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <title>mini-detective</title>
  </head>
  <style>
     .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        .classified-stamp {
            position: absolute;
            top: 1rem;
            right: -2rem;
            transform: rotate(15deg);
            padding: 0.25rem 1rem;
            border: 2px solid theme('colors.error');
            color: theme('colors.error');
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            mix-blend-mode: screen;
            z-index: 10;
        }
  </style>
  <body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col
   relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
   <div class="noise-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
